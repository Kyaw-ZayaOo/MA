<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MA Interview English Practice</title>
<style>
:root{--bg:#faf6ee;--fg:#1f2a37;--cd:#fff;--ac:#b45309;--tl:#0f766e;--mu:#6b7280;--bd:#e5dccb;--ok:#15803d;--no:#b91c1c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15171c;--fg:#eceff4;--cd:#20242c;--ac:#f59e0b;--tl:#2dd4bf;--mu:#9aa3b2;--bd:#343a46;--ok:#4ade80;--no:#f87171;color-scheme:dark}}
:root[data-theme=dark]{--bg:#15171c;--fg:#eceff4;--cd:#20242c;--ac:#f59e0b;--tl:#2dd4bf;--mu:#9aa3b2;--bd:#343a46;--ok:#4ade80;--no:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main,header{max-width:760px;margin:auto;padding:14px 16px}
h1{font-size:1.35rem;margin:.2em 0}h2{font-size:1.2rem;margin:.3em 0}h3{margin:.2em 0}
.mu{color:var(--mu);font-size:.92rem}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--tl);transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
.ch{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;text-align:left}
.ch b{color:var(--ac)}.ch:hover{border-color:var(--ac)}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button,.btn{border:1px solid var(--ac);background:none;border-radius:20px;padding:6px 14px}
.tabs .on,.btn{background:var(--ac);color:#fff}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:10px 0}
.b{position:relative;padding:8px 40px 8px 12px;margin:8px 0;border-radius:12px;max-width:92%}
.b b{display:block;font-size:.8rem;opacity:.8}
.p{background:var(--cd);border:1px solid var(--bd)}
.s{background:color-mix(in srgb,var(--tl) 18%,var(--cd));margin-left:auto}
.b button{position:absolute;right:6px;top:6px;border:0;background:none}
.hide .s span{filter:blur(6px);cursor:pointer}
.tip{border-left:4px solid var(--ac);padding:6px 12px;background:var(--cd);border-radius:6px}
.o{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 12px;border:1px solid var(--bd);border-radius:10px;background:none}
.o:hover{border-color:var(--ac)}.o.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,transparent)}.o.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 20%,transparent)}
textarea{width:100%;min-height:90px;box-sizing:border-box;margin:8px 0;padding:8px;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:10px}
.nav{display:flex;justify-content:space-between;margin:16px 0}
</style></head><body>
<header><h1>🎓 MA Interview English Practice</h1>
<div class="mu">Level B1 · For Khin Myat Noe Aung, BA Economics, Taungoo University</div>
<div class="bar" style="margin-top:8px"><i id="pb"></i></div><div class="mu" id="pt"></div></header>
<main id="m"></main>
<script>
const C=[
{t:"Introducing Yourself",d:["Good morning. Please sit down. Could you introduce yourself?","Good morning, Professor. My name is Khin Myat Noe Aung. I am 23 years old and I am from Thagaya.","Nice to meet you. Please tell me a little about yourself.","I recently finished my BA in Economics at Taungoo University. Now I would like to continue to the MA programme."],tip:"Greet politely, then give your name, age, hometown and one sentence about your study. Keep it short and clear.",q:[["Best answer to “Could you introduce yourself?”",["Yes.","Good morning, Professor. My name is Khin Myat Noe Aung and I am from Thagaya.","I don’t know what to say."],1],["Which reply is more polite?",["Nice to meet you, Professor.","Hey, what’s up?","Okay, start."],0]]},
{t:"Hometown and Family",d:["Where are you from, exactly?","I am from Thagaya, a small town where people are friendly and life is quiet.","Can you tell me about your family?","There are five people in my family. My parents run a small shop, and my younger brother is still in high school."],tip:"After the place name, add one detail. Don’t only say “I’m from X.” (Change the family details to match your real life.)",q:[["Best answer to “Where are you from?”",["Thagaya.","I am from Thagaya, a small town where life is quiet.","Far from here."],1],["Which sentence is correct?",["There are five people in my family.","There is five people in my family.","My family are five."],0]]},
{t:"Your University Studies",d:["What did you study at university?","I studied Economics for my BA at Taungoo University. It was a four-year degree.","How was your experience there?","It was very good. I learned a lot about theory, and I also joined group research and class presentations."],tip:"Use “I studied… at…” or “I majored in…”. Use past simple for finished studies.",q:[["I ____ Economics at Taungoo University.",["studied","study","am studying"],0],["“Major” means…",["your main subject","a big problem","a teacher"],0]]},
{t:"Why Economics?",d:["Why did you choose Economics as your major?","I chose it because I wanted to understand how money, prices and jobs affect ordinary people in Myanmar.","Was there a special moment that interested you?","Yes. When prices rose quickly, I saw my parents worry about the cost of rice and oil. I wanted to understand why."],tip:"Use “because” and a personal reason. Connect it to real life in Myanmar: prices, jobs, farming.",q:[["Which reason is strongest?",["It was easy.","Because I wanted to understand why prices change in Myanmar.","My friend chose it."],1],["“I wanted to understand why” means…",["I wanted to know the reason.","I was angry.","I didn’t like it."],0]]},
{t:"Your Results",d:["I see you passed with a star. Congratulations! How did you do that?","Thank you, Professor. I studied regularly, reviewed my notes every night, and asked my teachers when I did not understand.","Which subject was your strongest?","Microeconomics. I enjoyed solving problems about supply, demand and market prices."],tip:"Be proud but humble. Say thank you, give real study habits, and don’t brag (“I am the best”).",q:[["Best reply to “Congratulations!”",["Thank you, Professor. I worked hard and my teachers helped me.","Of course, I am the best.","It was nothing."],0],["Which is a good study habit?",["I review my notes every night.","I study only before exams.","I never ask questions."],0]]},
{t:"Your Research Paper",d:["Did you write a research paper in your final year?","Yes, I did. My topic was how small shops in Taungoo earn income and manage costs.","What did you find?","I found that many owners make low profit because transport and electricity are expensive."],tip:"Describe research in three steps: topic, method, result. Useful words: “I interviewed…”, “I found that…”.",q:[["Which sentence describes the METHOD?",["I interviewed 30 shop owners.","Costs were high.","My topic was small shops."],0],["“I found that…” introduces…",["a result","a greeting","a question"],0]]},
{t:"Why an MA?",d:["Why do you want to continue to a Master’s programme?","My BA gave me the basics. I want deeper knowledge, especially in research and data analysis, so I can understand Myanmar’s problems better.","Why not start working now?","Working is important too, but I believe more study will give me better skills and more opportunities later."],tip:"Structure: what you have (basics) → what you want (deeper skills) → why (to help). This shows motivation.",q:[["Best reason:",["Everybody does it.","I want deeper research skills to understand Myanmar’s economy.","I have nothing to do."],1],["“Opportunities” means…",["chances","problems","rules"],0]]},
{t:"Why This Department?",d:["Why do you want to study in our department?","Your department has experienced teachers and a strong research tradition. Many graduates work in important places in Myanmar’s economy.","What do you know about our MA programme?","I know it includes Advanced Microeconomics, Econometrics, Development Economics and a thesis."],tip:"Learn about the department before the interview. Mention real teachers, courses and results. Never invent facts.",q:[["Why should you research the department?",["To show you are serious and prepared","To get free books","No reason"],0],["Best way to mention courses:",["I know your programme includes Econometrics and a thesis.","I know nothing about it.","Your programme is probably easy."],0]]},
{t:"Strengths and Weaknesses",d:["What are your strengths?","I am hardworking and curious. I also like working in a team.","And what is your weakness?","Sometimes I feel shy when I speak English, but I practise every day with presentations and speaking clubs."],tip:"Give one real weakness and say how you are improving it. Never say “I have no weakness.”",q:[["Best weakness answer:",["I have no weakness.","I am sometimes shy in English, so I practise every day.","I am lazy."],1],["“Curious” means…",["you want to learn more","angry","tired"],0]]},
{t:"Myanmar’s Economy",d:["What do you think is the biggest challenge for Myanmar’s economy today?","I think inflation and the weak kyat are big problems. They make daily life hard, especially for poor families.","What can be done?","In my opinion, we need stable policies, support for farmers and small businesses, and more reliable electricity."],tip:"Give your opinion with “I think…” or “In my opinion…”, then a reason. Stay calm and factual.",q:[["Which phrase gives an opinion?",["In my opinion,","Excuse me,","Thank you,"],0],["“Inflation” means…",["prices go up over time","prices go down","people move away"],0]]},
{t:"Your Research Interest",d:["Which area of economics interests you most?","Development economics, especially rural livelihoods. I am interested in how farmers, such as rice farmers, can earn more.","Why is that important?","Farming is still important for many families in Myanmar, so a better income for farmers can reduce poverty."],tip:"Name your area, give an example from Myanmar, and say why it matters.",q:[["Which is a research topic?",["How microfinance helps village women in Myanmar","I like tea","The bus is late"],0],["“Livelihoods” means…",["ways people earn a living","holidays","buildings"],0]]},
{t:"Challenges and Support",d:["A Master’s can be difficult. What challenges do you expect?","Research will be hard and my family has a limited budget. But I will manage my time well and apply for scholarships.","Does your family support your decision?","Yes. My parents are proud of me and they encourage me to study."],tip:"Show you see problems and have a plan: “I expect… but I will…”.",q:[["Best answer:",["I expect hard work, but I will plan my time.","No problem, it’s easy.","I will quit."],0],["A “scholarship” is…",["money for a student’s study","a school bag","a test"],0]]},
{t:"Future Plans",d:["What will you do after you finish your MA?","I hope to work as a researcher or a lecturer. Later, I would like to do a PhD if I get the chance.","Where do you see yourself in five years?","In five years, I see myself teaching economics or working on development projects in Myanmar."],tip:"Use “I hope to…”, “I would like to…”, “I plan to…”. Be realistic and clear.",q:[["Which plan sounds polite?",["I would like to become a lecturer.","I want lecturer now.","I will maybe."],0],["“In five years, I see myself…” talks about…",["the future","the past","yesterday"],0]]},
{t:"Helping Myanmar",d:["How will your studies help Myanmar?","I want to use my knowledge to help farmers and small businesses, and to teach young students about economics.","Would you like to work in your hometown?","Yes, I would like to share what I learn with people in Thagaya and nearby towns."],tip:"Be concrete: say WHO you will help and HOW.",q:[["Strongest answer:",["I want to help small businesses with research.","I want money.","I will go abroad and forget."],0],["“Contribute” means…",["give help or effort","take away","forget"],0]]},
{t:"Closing the Interview",d:["Do you have any questions for us?","Yes, Professor. Could you tell me about research opportunities for MA students?","Thank you for coming, Khin Myat Noe Aung. We will tell you the result soon.","Thank you very much for your time, Professor. I really appreciate this opportunity."],tip:"Ask one good question, say thank you, smile and stay polite until you leave.",q:[["Good question to ask:",["Could you tell me about research opportunities?","Is it easy to pass?","When do I get my degree?"],0],["Best ending:",["Thank you for your time, Professor.","Bye.","Okay."],0]]}
];
const A=C.map(()=>[null,null]),D={},$=id=>document.getElementById(id);
let cur=-1,tab=0;
function prog(){const n=Object.keys(D).length;$("pb").style.width=n/C.length*100+"%";$("pt").textContent=n+" of "+C.length+" chapters completed"}
function home(){cur=-1;prog();$("m").innerHTML='<p>Choose a chapter. Each one has <b>1. Learn</b> (dialogue) and <b>2. Practise</b> (quiz and role play).</p><div class="grid">'+C.map((c,i)=>`<button class="ch" onclick="go(${i})"><b>Chapter ${i+1}</b> ${D[i]!=null?"✅":""}<br>${c.t}</button>`).join("")+"</div>";scrollTo(0,0)}
function go(i,t=0){cur=i;tab=t;const c=C[i];
$("m").innerHTML=`<button class="btn" onclick="home()">← All chapters</button><h2>Chapter ${i+1}: ${c.t}</h2><div class="tabs"><button class="${t?"":"on"}" onclick="go(${i},0)">1. Learn</button><button class="${t?"on":""}" onclick="go(${i},1)">2. Practise</button></div>`+(t?pr(i):ln(i))+`<div class="nav"><button class="btn" ${i?"":"disabled"} onclick="go(${i-1})">← Previous</button><button class="btn" ${i<C.length-1?"":"disabled"} onclick="go(${i+1})">Next →</button></div>`;scrollTo(0,0)}
function ln(i){const c=C[i];return `<p class="mu">Read and listen. Press 🔊 to hear a line. Then hide Khin’s answers and try to say them yourself.</p><button class="btn" onclick="document.getElementById('dl').classList.toggle('hide')">👁 Hide / show Khin’s answers</button><div id="dl">`+c.d.map((l,k)=>`<div class="b ${k%2?"s":"p"}"><b>${k%2?"Khin":"Professor"}</b><span onclick="this.style.filter='none'">${l}</span><button onclick="say(${k})" aria-label="Listen">🔊</button></div>`).join("")+`</div><div class="tip">💡 <b>How to answer:</b> ${c.tip}</div>`}
function say(k){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(C[cur].d[k]);u.lang="en-GB";u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function pr(i){const c=C[i],r=(i%2)*2;return c.q.map((q,n)=>`<div class="card"><p><b>${n+1}.</b> ${q[0]}</p>`+q[1].map((o,k)=>`<button class="o" id="o${n}_${k}" onclick="pick(${i},${n},${k})">${o}</button>`).join("")+`<p id="f${n}"></p></div>`).join("")+`<div class="card"><h3>🎭 Role play</h3><p>You are Khin. The professor asks you:</p><div class="b p"><b>Professor</b>${c.d[r]}</div><textarea id="ta" placeholder="Type or say your answer here…"></textarea><button class="btn" onclick="show(${i},${r})">Show model answer</button><div id="md"></div></div>`}
function pick(i,n,k){if(A[i][n]!=null)return;const q=C[i].q[n],ok=k==q[2];A[i][n]=ok;
q[1].forEach((_,j)=>{const b=$(`o${n}_${j}`);if(j==q[2])b.classList.add("ok");else if(j==k)b.classList.add("no")});
$("f"+n).textContent=ok?"✅ Correct!":"❌ Not quite. The best answer is: "+q[1][q[2]];
if(A[i].every(x=>x!=null)){D[i]=A[i].filter(x=>x).length;prog()}}
function show(i,r){$("md").innerHTML=`<p class="mu">Compare your answer with this model:</p><div class="b s"><b>Khin (model)</b>${C[i].d[r+1]}</div><div class="tip">💡 ${C[i].tip}<br>Check: is your answer polite, clear and 2–3 sentences long?</div>`}
home();
</script></body></html>
